# 매일 자동 광고 제작 + 유튜브 예약 업로드
# - 04:00 KST(= 19:00 UTC 전날)에 시작. 깃허브 예약 실행은 수십 분 늦을 수 있다(공개 시각은 publishAt 이라 영향 없음).
# - 채널마다 job 1개(matrix). Claude Code 가 채널당 COUNT 개 편집계획(EDL)을 쓰고, 스크립트가 렌더 → 비공개+예약 업로드.
# - 자동 검수 없음: 공개 시각 전에 사람이 유튜브 스튜디오에서 직접 확인한다.
# - 결과(EDL, 업로드 기록, 보고서)는 저장소에 커밋, 영상 파일은 Artifacts 로 7일 보관.
# - 실패(로그인 만료·쿼터·업로드 오류)하면 job 이 빨간색 → 깃허브가 계정 메일로 알림.
name: daily-ads

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "특정 채널만 (비우면 사용 중인 채널 전부)"
        required: false
        default: ""
      count:
        description: "채널당 제작 편수"
        required: false
        default: "1"
      publish_now:
        description: "예약 없이 즉시 공개 (실시간 확인용)"
        type: boolean
        required: false
        default: false

concurrency:
  group: daily-ads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      channels: ${{ steps.c.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          ONLY_CHANNEL: ${{ github.event.inputs.channel }}
        run: echo "list=$(cd tools && python3 ci_credentials.py --enabled-channels)" >> "$GITHUB_OUTPUT"

  make:
    needs: plan
    if: needs.plan.outputs.channels != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        channel: ${{ fromJson(needs.plan.outputs.channels) }}
    env:
      CHANNEL: ${{ matrix.channel }}
      ALL: ${{ needs.plan.outputs.channels }}
      COUNT: ${{ github.event.inputs.count || '1' }}
      PUBLISH_NOW: ${{ github.event.inputs.publish_now == 'true' && '1' || '0' }}
      PYTHONIOENCODING: utf-8
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fontconfig fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 파이썬 패키지
        run: pip install -r requirements.txt

      - name: 소스 캐시 (구글 드라이브)
        uses: actions/cache@v4
        with:
          path: 참고영상 소스
          key: drive-${{ hashFiles('config/drive.json') }}-${{ github.run_id }}
          restore-keys: drive-${{ hashFiles('config/drive.json') }}-

      - name: Whisper 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: 폰트 받기 (G마켓 산스 무료 폰트, 공식 배포처 — 매번 받음)
        run: |
          curl -sSL --retry 3 -o /tmp/gm.zip https://corp.gmarket.com/fonts/GmarketSansTTF.zip
          unzip -o -j /tmp/gm.zip '*.ttf' -d assets/fonts
          # 리눅스 libass 는 fontsdir 로만 준 글꼴의 한글을 네모로 그림 → 시스템 글꼴로 정식 설치
          mkdir -p ~/.local/share/fonts && cp assets/fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f
          fc-list | grep -i gmarket
          cd tools && python -c "from common import ass_family; print('자막 글꼴:', ass_family('Gmarket Sans TTF', True))"

      - name: 드라이브 동기화 (새 파일만)
        run: cd tools && python drive_sync.py

      - name: 유튜브 인증 복원 + 로그인 확인
        env:
          YT_CREDENTIALS: ${{ secrets.YT_CREDENTIALS }}
        run: |
          cd tools && python ci_credentials.py
          python - <<'EOF'
          import os, sys
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          ch = os.environ["CHANNEL"]
          try:
              c = Credentials.from_authorized_user_file(f"../upload/channels/{ch}/token.json")
              c.refresh(Request())
              print(f"{ch}: 로그인 유효")
          except Exception as e:
              print(f"::error::{ch} 유튜브 로그인 만료 → PC에서 relogin_windows.bat 실행 ({e})")
              sys.exit(1)
          EOF

      - name: .env
        run: |
          {
            echo "TTS_PROVIDER=gemini"
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
            echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}"
          } > .env

      - name: Gemini 키 확인 (Claude 실행 전에 빨리 실패)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "등록된 키 길이: ${#GEMINI_API_KEY}자 (정상 키는 30자 이상)"
          code=$(curl -s -o /tmp/g.json -w '%{http_code}' -H "x-goog-api-key: ${GEMINI_API_KEY}" \
            https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts)
          if [ "$code" != "200" ]; then echo "::error::Gemini 키 인증 실패 (HTTP $code) → setup_secrets.bat 로 키 재등록"; head -c 400 /tmp/g.json; exit 1; fi
          echo "Gemini 키 OK"

      - name: Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Claude 는 편집계획(EDL)만 쓴다. 렌더·업로드는 아래 스크립트가 한 번만 실행(재시도·자동 검수 없음 → 토큰 절약)
      - name: 편집계획 작성 (Claude)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "CLAUDE.md 의 '서버 자동 제작' 절차대로 채널 ${CHANNEL} 용 새 EDL ${COUNT}개를 edl/${CHANNEL}/ 에 작성하라. 오늘 날짜는 $(date +%Y-%m-%d), 파일명 앞자리는 $(date +%y%m%d) 이다." \
            --dangerously-skip-permissions --max-turns 40 --output-format text | tee claude_output.txt

      - name: 렌더 + 예약 업로드
        run: |
          # 채널마다 음성 요청 시점을 40초씩 늦춰 Gemini 분당 한도 충돌 방지
          idx=$(python3 -c "import json,os;print(json.loads(os.environ['ALL'] ).index(os.environ['CHANNEL']))")
          sleep $((idx * 40))
          cd tools
          shopt -s nullglob
          # 이번 실행에서 새로 만든(아직 커밋 안 된) EDL 만 렌더
          mapfile -t edls < <(cd .. && git ls-files --others --exclude-standard "edl/${CHANNEL}" | grep '\.json$' | sed 's#^#../#')
          [ ${#edls[@]} -gt 0 ] || { echo "::error::오늘 EDL 이 없음 (Claude 단계 로그 확인)"; exit 1; }
          rc=0
          for e in "${edls[@]}"; do
            echo "=== $e"
            python render.py "$e" --channel "${CHANNEL}" --upload || { rc=$?; echo "::error::$e 실패 (코드 $rc: 2 로그인 만료 / 3 쿼터 / 4 업로드 실패)"; }
          done
          exit $rc

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "daily-ads-bot"
          git config user.email "actions@users.noreply.github.com"
          git add edl "upload/channels/${CHANNEL}/logs" || true
          git diff --cached --quiet && exit 0
          git commit -m "daily-ads: ${CHANNEL} $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((i*5)); done
          exit 1

      - name: 영상 보관 (Artifacts, 7일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ matrix.channel }}-${{ github.run_id }}
          path: |
            광고 결과 영상/*.mp4
            upload/channels/${{ matrix.channel }}/hold/
            claude_output.txt
          retention-days: 7
          if-no-files-found: ignore

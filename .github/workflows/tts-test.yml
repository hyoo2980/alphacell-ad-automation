# ElevenLabs 기본(premade) 목소리 샘플 — 무료 계정 1번으로 같은 광고 문장을 목소리별로 생성 → Artifacts. Claude 사용 안 함.
name: tts-test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      PYTHONIOENCODING: utf-8
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_ACCOUNTS: ${{ secrets.ELEVENLABS_ACCOUNTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 기본 목소리 샘플 생성
        run: |
          mkdir -p samples && cd tools && python - <<'EOF'
          import re, requests, tts
          a = tts.xi_accounts()[0]
          h = {"xi-api-key": a["key"]}
          text = "밥만 먹으면 졸리시죠? 식후 혈당 때문일 수 있어요. 지금 쿠팡에서 알파셀 혈당 세이프를 검색해보세요!"
          voices = [v for v in requests.get("https://api.elevenlabs.io/v1/voices", headers=h, timeout=30).json()["voices"]
                    if v.get("category") == "premade"]
          print(f"기본 목소리 {len(voices)}개")
          for v in voices[:14]:
              lab = v.get("labels") or {}
              r = requests.post(f"https://api.elevenlabs.io/v1/text-to-speech/{v['voice_id']}?output_format=mp3_44100_128",
                                headers=h, json={"text": text, "model_id": "eleven_v3", "language_code": "ko"}, timeout=120)
              name = re.sub(r"[^\w]+", "_", f"{v['name']}_{lab.get('gender','')}_{lab.get('age','')}").strip("_")
              if r.ok:
                  open(f"../samples/{name}.mp3", "wb").write(r.content)
              print(f"{'OK ' if r.ok else 'FAIL'} {name} | {v['voice_id']} | {'' if r.ok else r.text[:120]}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: samples/
